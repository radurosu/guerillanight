# /etc/nginx/sites-available/guerillanight
# Symlink: ln -s /etc/nginx/sites-available/guerillanight /etc/nginx/sites-enabled/guerillanight
#
# After installing, run:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d guerillanight.eloquentix.com

server {
    listen 80;
    server_name guerillanight.eloquentix.com;

    # SSE endpoint — needs buffering off + long timeout for generation
    location /api/generate {
        proxy_pass http://127.0.0.1:8900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # All other routes — normal proxy
    location / {
        proxy_pass http://127.0.0.1:8900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/guerillanight.access.log;
    error_log  /var/log/nginx/guerillanight.error.log;
}
