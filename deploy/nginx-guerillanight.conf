# /etc/nginx/sites-available/guerillanight
# Symlink: ln -s /etc/nginx/sites-available/guerillanight /etc/nginx/sites-enabled/guerillanight
#
# After installing, run:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d guerillanight.eloquentix.com

server {
    listen 80;
    server_name guerillanight.eloquentix.com;

    root /var/www/guerillanight;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # No cache for HTML (so new playlists show up immediately)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/guerillanight.access.log;
    error_log  /var/log/nginx/guerillanight.error.log;
}
