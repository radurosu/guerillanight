<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guerrilla Night — Grok Playlist</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e0ddd5;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
  }

  .hero {
    background: linear-gradient(135deg, #0a0a0f 0%, #1a1510 40%, #0f1a15 70%, #0a0a0f 100%);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 3rem 2rem 2.5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 30% 50%, rgba(255,180,100,0.07) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 30%, rgba(100,255,180,0.05) 0%, transparent 50%);
    pointer-events: none;
  }

  .hero h1 {
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #fff;
    position: relative;
  }

  .hero h1 span {
    background: linear-gradient(135deg, #fbbf24, #f97316);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero .meta {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.4);
    margin-top: 0.6rem;
    font-family: 'JetBrains Mono', monospace;
    position: relative;
  }

  .score-bar {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-top: 1.5rem;
    position: relative;
    flex-wrap: wrap;
  }

  .score-item {
    text-align: center;
  }

  .score-value {
    font-size: 1.8rem;
    font-weight: 700;
    color: #fbbf24;
  }

  .score-value.main {
    font-size: 2.4rem;
    background: linear-gradient(135deg, #fbbf24, #f97316);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .score-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.35);
    margin-top: 0.2rem;
  }

  .verdict {
    margin-top: 1.2rem;
    font-size: 0.85rem;
    color: rgba(255,200,100,0.7);
    font-style: italic;
    position: relative;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 1.5rem;
  }

  .phase-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.25);
    padding: 1.5rem 0 0.6rem;
    border-top: 1px solid rgba(255,255,255,0.04);
    margin-top: 0.5rem;
  }

  .phase-label:first-child {
    border-top: none;
    margin-top: 0;
  }

  .track {
    display: grid;
    grid-template-columns: 52px 1fr auto;
    gap: 0 1rem;
    padding: 0.65rem 0.8rem;
    border-radius: 8px;
    transition: background 0.2s;
    align-items: start;
  }

  .track:hover {
    background: rgba(255,255,255,0.03);
  }

  .track-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.3);
    padding-top: 2px;
  }

  .track-info {
    min-width: 0;
  }

  .track-artist {
    font-weight: 600;
    font-size: 0.95rem;
    color: #f0ece4;
  }

  .track-title {
    font-weight: 400;
    font-size: 0.95rem;
    color: rgba(255,255,255,0.55);
    margin-left: 0.3rem;
  }

  .track-title::before {
    content: '— ';
    color: rgba(255,255,255,0.2);
  }

  .track-genres {
    display: flex;
    gap: 0.35rem;
    margin-top: 0.3rem;
    flex-wrap: wrap;
  }

  .genre-tag {
    font-size: 0.65rem;
    font-family: 'JetBrains Mono', monospace;
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.35);
    white-space: nowrap;
  }

  .genre-tag.romanian { background: rgba(251,191,36,0.12); color: rgba(255,210,100,0.7); }
  .genre-tag.electronic { background: rgba(100,180,255,0.1); color: rgba(130,190,255,0.7); }
  .genre-tag.trip-hop { background: rgba(255,150,100,0.1); color: rgba(255,170,130,0.6); }
  .genre-tag.folk { background: rgba(120,200,120,0.1); color: rgba(150,210,150,0.6); }

  .track-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.15);
    text-align: right;
    padding-top: 3px;
  }

  .footer {
    text-align: center;
    padding: 2rem;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.15);
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>
<body>

<div class="hero">
  <h1>Guerrilla <span>Night</span></h1>
  <div class="meta">Grok (grok-3) &middot; 34 tracks &middot; 28 May 2026</div>
  <div class="score-bar">
    <div class="score-item">
      <div class="score-value main">75.5</div>
      <div class="score-label">Style Score</div>
    </div>
    <div class="score-item">
      <div class="score-value">78.2</div>
      <div class="score-label">Genre</div>
    </div>
    <div class="score-item">
      <div class="score-value">44.7</div>
      <div class="score-label">Freshness</div>
    </div>
    <div class="score-item">
      <div class="score-value">85.3</div>
      <div class="score-label">Romanian</div>
    </div>
    <div class="score-item">
      <div class="score-value">100</div>
      <div class="score-label">Diversity</div>
    </div>
  </div>
  <div class="verdict">Good — clearly Guerrilla-inspired, minor drift.</div>
</div>

<div class="container" id="tracklist"></div>

<div class="footer">
  Generated by Guerrilla Night AI &middot; guerillanight.eloquentix.com
</div>

<script>
const tracks = [{"time":"20:00","artist":"Olivia Rodrigo","title":"drivers license","genre_tags":["indie pop","alternative"]},{"time":"20:04","artist":"The National","title":"Fake Empire","genre_tags":["indie rock","alternative"]},{"time":"20:08","artist":"Noah Kahan","title":"Stick Season","genre_tags":["folk pop","singer-songwriter"]},{"time":"20:11","artist":"Cigarettes After Sex","title":"Apocalypse","genre_tags":["dream pop","indie"]},{"time":"20:16","artist":"U2","title":"Every Breaking Wave","genre_tags":["alternative rock","rock"]},{"time":"20:20","artist":"Phoebe Bridgers","title":"Motion Sickness","genre_tags":["indie folk","singer-songwriter"]},{"time":"20:24","artist":"Lana Del Rey","title":"Venice Bitch","genre_tags":["art pop","indie"]},{"time":"20:34","artist":"Foals","title":"My Number","genre_tags":["indie rock","dance rock"]},{"time":"20:38","artist":"Katie Melua","title":"The Closest Thing to Crazy","genre_tags":["jazz pop","singer-songwriter"]},{"time":"20:42","artist":"Daughter","title":"Youth","genre_tags":["indie folk","ambient"]},{"time":"22:00","artist":"Moderat","title":"Bad Kingdom","genre_tags":["electronic","techno"]},{"time":"22:04","artist":"Portishead","title":"Glory Box","genre_tags":["trip-hop","downtempo"]},{"time":"22:09","artist":"Faithless","title":"Insomnia","genre_tags":["electronic","dance"]},{"time":"22:18","artist":"Bonobo","title":"Kerala","genre_tags":["electronic","chillout"]},{"time":"22:22","artist":"M83","title":"Midnight City","genre_tags":["synthwave","indie electronic"]},{"time":"22:26","artist":"Morcheeba","title":"The Sea","genre_tags":["trip-hop","downtempo"]},{"time":"22:31","artist":"The xx","title":"Intro","genre_tags":["indie electronic","minimal"]},{"time":"22:33","artist":"Anotr","title":"Relax My Eyes","genre_tags":["house","electronic"]},{"time":"22:37","artist":"Massive Attack","title":"Teardrop","genre_tags":["trip-hop","electronic"]},{"time":"22:42","artist":"London Grammar","title":"Hey Now","genre_tags":["indie electronic","alternative"]},{"time":"22:46","artist":"Zero 7","title":"Destiny","genre_tags":["chillout","downtempo"]},{"time":"22:52","artist":"Coma","title":"Spiders","genre_tags":["indie rock","electronic"]},{"time":"22:56","artist":"Agnes Obel","title":"Riverside","genre_tags":["chamber folk","ambient"]},{"time":"01:00","artist":"Leonard Cohen","title":"You Want It Darker","genre_tags":["folk","singer-songwriter"]},{"time":"01:04","artist":"Fiona Apple","title":"Criminal","genre_tags":["soul","alternative"]},{"time":"01:10","artist":"Nick Cave & The Bad Seeds","title":"Higgs Boson Blues","genre_tags":["alternative rock","blues"]},{"time":"01:17","artist":"Tom Waits","title":"Hold On","genre_tags":["blues","singer-songwriter"]},{"time":"01:21","artist":"Alex Warren","title":"Carry You Home","genre_tags":["indie pop","folk pop"]},{"time":"01:24","artist":"Radiohead","title":"Pyramid Song","genre_tags":["art rock","ambient"]},{"time":"01:29","artist":"Cristian Vasile","title":"Strada Speranței","genre_tags":["romanian tango","folk"]},{"time":"01:32","artist":"Nick Drake","title":"Pink Moon","genre_tags":["folk","acoustic"]},{"time":"01:34","artist":"Carla Bruni","title":"Quelqu'un m'a dit","genre_tags":["chanson","acoustic"]},{"time":"01:37","artist":"ROA","title":"D-Aia","genre_tags":["romanian","electronic"]},{"time":"01:40","artist":"James Blake","title":"Retrograde","genre_tags":["electronic soul","ambient"]}];

const phases = [
  { label: "Easing In — Mid-tempo rock / pop / indie", start: "20:00", end: "22:00" },
  { label: "Building Energy — Electronic / trip-hop / deep alternative", start: "22:00", end: "01:00" },
  { label: "Winding Down — Atmospheric / folk / soul", start: "01:00", end: "02:00" }
];

function timeToMin(t) {
  const [h, m] = t.split(':').map(Number);
  return h < 6 ? (h + 24) * 60 + m : h * 60 + m;
}

function genreClass(tag) {
  const t = tag.toLowerCase();
  if (t.includes('romanian')) return 'romanian';
  if (t.includes('electronic') || t.includes('ambient') || t.includes('techno') || t.includes('house') || t.includes('dubstep') || t.includes('chillout') || t.includes('downtempo') || t.includes('synthwave') || t.includes('minimal')) return 'electronic';
  if (t.includes('trip-hop') || t.includes('trip hop')) return 'trip-hop';
  if (t.includes('folk') || t.includes('acoustic') || t.includes('singer-songwriter') || t.includes('chanson')) return 'folk';
  return '';
}

const container = document.getElementById('tracklist');
let currentPhase = -1;

tracks.forEach((t, i) => {
  const mins = timeToMin(t.time);
  const phaseIdx = phases.findIndex((p) => {
    const s = timeToMin(p.start), e = timeToMin(p.end);
    return mins >= s && mins < e;
  });

  if (phaseIdx !== currentPhase && phaseIdx >= 0) {
    currentPhase = phaseIdx;
    const label = document.createElement('div');
    label.className = 'phase-label';
    label.textContent = phases[phaseIdx].label;
    container.appendChild(label);
  }

  const row = document.createElement('div');
  row.className = 'track';
  row.innerHTML = `
    <div class="track-time">${t.time}</div>
    <div class="track-info">
      <div>
        <span class="track-artist">${t.artist}</span>
        <span class="track-title">${t.title}</span>
      </div>
      <div class="track-genres">
        ${t.genre_tags.map(g => `<span class="genre-tag ${genreClass(g)}">${g}</span>`).join('')}
      </div>
    </div>
    <div class="track-num">${String(i + 1).padStart(2, '0')}</div>
  `;
  container.appendChild(row);
});
</script>
</body>
</html>
