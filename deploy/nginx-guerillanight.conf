# /etc/nginx/sites-available/guerillanight
# Symlink: ln -s /etc/nginx/sites-available/guerillanight /etc/nginx/sites-enabled/guerillanight

server {
    server_name guerillanight.eloquentix.com;

    # SSE endpoint — needs buffering off + long timeout for generation
    location /api/generate {
        proxy_pass http://127.0.0.1:8900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # All other routes — normal proxy
    location / {
        proxy_pass http://127.0.0.1:8900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/guerillanight.access.log;
    error_log  /var/log/nginx/guerillanight.error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/guerillanight.eloquentix.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/guerillanight.eloquentix.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = guerillanight.eloquentix.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name guerillanight.eloquentix.com;
    return 404; # managed by Certbot
}
